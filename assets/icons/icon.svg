<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background rounded squircle -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2229"/>
      <stop offset="100%" stop-color="#101216"/>
    </linearGradient>
    <!-- Lens glass gradient -->
    <radialGradient id="lensGlass" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#e0f7fa" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#00e5ff" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#0f3460" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#060e18" stop-opacity="1"/>
    </radialGradient>
    <!-- Metallic rim gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a5568"/>
      <stop offset="50%" stop-color="#2d3748"/>
      <stop offset="100%" stop-color="#1a202c"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="25.6" y="25.6" width="460.8" height="460.8" rx="112.64" ry="112.64" fill="url(#bgGrad)" stroke="#374151" stroke-width="7.68" filter="url(#dropShadow)"/>

  <!-- Outer Lens Rim -->
  <circle cx="256" cy="256" r="184.32" fill="url(#rimGrad)" stroke="#1a202c" stroke-width="10.24"/>
  <circle cx="256" cy="256" r="158.72" fill="#0f172a" stroke="#00e5ff" stroke-width="4.096" stroke-opacity="0.6"/>

  <!-- Inner Optical Aperture -->
  <circle cx="256" cy="256" r="143.36" fill="url(#lensGlass)"/>

  <!-- Gold Sensor Pupil -->
  <circle cx="256" cy="256" r="46.08" fill="#ffd700" stroke="#b45309" stroke-width="5.12"/>
  <circle cx="256" cy="256" r="20.48" fill="#1e1e1e"/>

  <!-- Specular Lens Glare -->
  <ellipse cx="215.04" cy="204.8" rx="40.96" ry="25.6" fill="#ffffff" fill-opacity="0.45" transform="rotate(-30, 215.04, 204.8)"/>

  <!-- Viewfinder Reticles (Golden Brackets) -->
  <g stroke="#ffd700" stroke-width="10.24" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top-Left -->
    <path d="M 81.92 133.12 L 81.92 81.92 L 133.12 81.92"/>
    <!-- Top-Right -->
    <path d="M 378.88 81.92 L 430.08 81.92 L 430.08 133.12"/>
    <!-- Bottom-Left -->
    <path d="M 81.92 378.88 L 81.92 430.08 L 133.12 430.08"/>
    <!-- Bottom-Right -->
    <path d="M 378.88 430.08 L 430.08 430.08 L 430.08 378.88"/>
  </g>

  <!-- Live Record Beacon (Red Dot) -->
  <circle cx="394.24" cy="117.76" r="19.456" fill="#ff3b30"/>
  <circle cx="394.24" cy="117.76" r="28.16" fill="#ff3b30" fill-opacity="0.35"/>
</svg>